name: Build testing APK

on:
  push:
    branches:
      - dev/swipe-hold-and-gif
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unstable-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and build resources
        uses: actions/checkout@v4
        with:
          # build.gradle derives version metadata from master and tags.
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build unstable debug APK
        run: ./gradlew assembleUnstableDebug --console=plain
        env:
          # CI checks out a detached feature-branch commit; do not depend on a local master ref.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.30-test.${{ github.run_number }}
          BRANCH_NAME: ${{ github.ref_name }}

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: android-keyboard-unstable-debug-${{ github.sha }}
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
